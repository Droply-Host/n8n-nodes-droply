# Publishes n8n-nodes-droply to npm when a version tag (e.g. 0.2.0) is pushed, with npm provenance, as n8n
# requires for verified community nodes since 2026-05-01.
#
# Two jobs, so that no dependency code ever runs with the right to publish:
#
# - build: installs the dev tooling (hundreds of packages), lints, tests, builds and packs the tarball. It
#   has no id-token and no npm token.
# - publish: needs the `npm-publish` environment (add a required reviewer to it in the repo settings), gets
#   the GitHub OIDC token, installs nothing, and publishes the tarball built above with scripts disabled.
#
# Actions are pinned to commit SHAs, not movable tags.
#
# One-time setup:
#   1. Settings > Environments > New environment `npm-publish`, with you as a required reviewer.
#   2. Settings > Rules > a tag ruleset for `*.*.*` so only maintainers can create version tags.
#   3. npm: Trusted Publisher for this repo, workflow `publish.yml`, environment `npm-publish`. Until the
#      package exists on npm, a short-lived granular token in the NPM_TOKEN secret of the environment works
#      instead; delete it after the first release and set the package to require 2FA and disallow tokens.
#
# Releasing: `npm run release` bumps the version, updates the changelog, tags and pushes.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only publish commits that are on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the tag matches the version
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Pack
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # Required to mint the OIDC token for npm Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      - name: Publish with provenance
        # Trusted Publishing (OIDC) when NPM_TOKEN is unset; the token only as a first-release fallback.
        run: |
          npm --version
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish ./*.tgz --provenance --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
